<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAPL Admin Login</title>

<style>

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#111827;
    --muted:#667085;
    --line:#dfe4ea;
    --red:#e51d2a;
    --red-dark:#c91420;
}

html.dark{
    --bg:#070a0f;
    --card:#101720;
    --text:#f5f7fa;
    --muted:#96a3b3;
    --line:#293543;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at top right,
            rgba(229,29,42,.08),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    transition:.25s ease;
}


/* ==============================
   MAIN CONTAINER
============================== */

.login-wrapper{
    width:100%;
    max-width:440px;
    padding:25px;
}


/* ==============================
   LOGIN CARD
============================== */

.login-card{

    background:var(--card);

    border:1px solid var(--line);

    border-radius:24px;

    padding:38px 34px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.10);

    position:relative;

    overflow:hidden;
}


/* Top Red Line */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:4px;

    background:var(--red);
}


/* ==============================
   BRAND
============================== */

.brand{

    text-align:center;

    margin-bottom:30px;
}


.logo-box{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    background:#fff;

    padding:8px 15px;

    border-radius:12px;

    margin-bottom:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);
}


.logo{

    width:175px;
    height:48px;

    object-fit:contain;
}


.brand-title{

    font-size:20px;

    font-weight:900;

    letter-spacing:.7px;
}


.brand-subtitle{

    color:var(--muted);

    font-size:12px;

    margin-top:5px;
}


/* ==============================
   LOGIN HEADER
============================== */

.login-title{

    text-align:center;

    margin-bottom:25px;
}


.login-title h1{

    margin:0;

    font-size:25px;

    font-weight:900;
}


.login-title p{

    margin:7px 0 0;

    color:var(--muted);

    font-size:13px;
}


/* ==============================
   FORM
============================== */

.form-group{

    margin-bottom:18px;
}


.form-group label{

    display:block;

    font-size:12px;

    font-weight:800;

    margin-bottom:7px;

    color:var(--text);
}


.input-wrapper{

    position:relative;
}


.input-wrapper input{

    width:100%;

    height:50px;

    padding:
        0 15px;

    border:

        1px solid var(--line);

    border-radius:11px;

    outline:none;

    background:var(--bg);

    color:var(--text);

    font-size:14px;

    transition:.2s ease;
}


.input-wrapper input:focus{

    border-color:var(--red);

    box-shadow:
        0 0 0 3px rgba(229,29,42,.10);

}


/* ==============================
   LOGIN BUTTON
============================== */

.login-btn{

    width:100%;

    height:52px;

    border:none;

    border-radius:11px;

    background:var(--red);

    color:#fff;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.25s ease;

    margin-top:5px;
}


.login-btn:hover{

    background:var(--red-dark);

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px rgba(229,29,42,.25);
}


.login-btn:active{

    transform:translateY(0);

}


/* ==============================
   ERROR
============================== */

.error-message{

    display:none;

    margin-top:15px;

    padding:11px 13px;

    border-radius:10px;

    background:rgba(229,29,42,.08);

    border:1px solid rgba(229,29,42,.20);

    color:var(--red);

    font-size:12px;

    text-align:center;

    font-weight:700;
}


.error-message.show{

    display:block;
}


/* ==============================
   SUCCESS
============================== */

.success-message{

    display:none;

    margin-top:15px;

    padding:11px 13px;

    border-radius:10px;

    background:rgba(16,185,129,.08);

    border:1px solid rgba(16,185,129,.20);

    color:#059669;

    font-size:12px;

    text-align:center;

    font-weight:700;
}


/* ==============================
   FOOTER
============================== */

.login-footer{

    text-align:center;

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid var(--line);

    color:var(--muted);

    font-size:11px;
}


/* ==============================
   BACK BUTTON
============================== */

.back-btn{

    display:block;

    text-align:center;

    margin-top:15px;

    color:var(--muted);

    text-decoration:none;

    font-size:12px;

    transition:.2s;
}


.back-btn:hover{

    color:var(--red);
}


/* ==============================
   THEME BUTTON
============================== */

.theme-btn{

    position:fixed;

    top:20px;
    right:20px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-size:16px;

    transition:.25s;
}


.theme-btn:hover{

    transform:rotate(15deg);

    border-color:var(--red);
}


/* ==============================
   LOADING
============================== */

.loading{

    opacity:.7;

    pointer-events:none;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:500px){

    .login-wrapper{

        padding:18px;
    }

    .login-card{

        padding:32px 23px;

        border-radius:20px;
    }

    .logo{

        width:150px;

        height:42px;
    }

    .brand-title{

        font-size:17px;
    }

}

</style>

</head>


<body>


<!-- THEME BUTTON -->

<button
    class="theme-btn"
    onclick="toggleTheme()"
    title="Toggle Dark / Light Mode">

    ☾

</button>



<div class="login-wrapper">


    <div class="login-card">


        <!-- ========================
             BRAND
        ========================= -->

        <div class="brand">


            <div class="logo-box">

                <img
                    class="logo"
                    src="https://modinaautopartsltd.com/_next/static/media/logo.40df2f61.svg"
                    alt="Modina Auto Parts Ltd">

            </div>


            <div class="brand-title">

                MAPL SALES

            </div>


            <div class="brand-subtitle">

                Sales & Performance Management

            </div>


        </div>



        <!-- ========================
             LOGIN TITLE
        ========================= -->

        <div class="login-title">

            <h1>
                Admin Login
            </h1>

            <p>
                Authorized access only
            </p>

        </div>



        <!-- ========================
             LOGIN FORM
        ========================= -->

        <form
            id="loginForm"
            onsubmit="login(event)">


            <!-- USER ID -->

            <div class="form-group">

                <label for="userid">
                    USER ID
                </label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="userid"
                        placeholder="Enter User ID"
                        autocomplete="username"
                        required>

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                LOGIN TO ADMIN PANEL →

            </button>


        </form>



        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage">

            Invalid User ID or Password.

        </div>



        <!-- SUCCESS -->

        <div
            class="success-message"
            id="successMessage">

            Login successful. Redirecting...

        </div>



        <!-- BACK -->

        <a
            href="index.html"
            class="back-btn">

            ← Back to MAPL Home

        </a>



        <!-- FOOTER -->

        <div class="login-footer">

            © Modina Auto Parts Ltd.<br>

            MAPL Sales Management System

        </div>


    </div>

</div>



<script>


/* =================================
   LOGIN CREDENTIALS
================================= */

const USER_ID = "Rakib";

const PASSWORD = "rakib4488";


/* =================================
   LOGIN
================================= */

function login(event){

    event.preventDefault();


    const user =
        document
        .getElementById("userid")
        .value
        .trim();


    const pass =
        document
        .getElementById("password")
        .value;


    const error =
        document
        .getElementById("errorMessage");


    const success =
        document
        .getElementById("successMessage");


    const button =
        document
        .getElementById("loginButton");


    error.classList.remove("show");


    success.style.display="none";


    /* CHECK LOGIN */

    if(
        user === USER_ID &&
        pass === PASSWORD
    ){

        success.style.display="block";


        button.textContent =
            "LOGIN SUCCESSFUL ✓";


        button.classList.add("loading");


        /*
         * Save login session
         * Session expires when browser tab is closed.
         */

        sessionStorage.setItem(
            "MAPL_ADMIN_LOGIN",
            "true"
        );


        sessionStorage.setItem(
            "MAPL_ADMIN_USER",
            user
        );


        /* REDIRECT */

        setTimeout(function(){

            window.location.href =
                "admin.html";

        },800);


    }else{

        error.classList.add("show");


        document
        .getElementById("password")
        .value="";


    }

}


/* =================================
   DARK / LIGHT MODE
================================= */

function toggleTheme(){

    document
    .documentElement
    .classList
    .toggle("dark");


    localStorage.setItem(

        "MAPL_THEME",

        document
        .documentElement
        .classList
        .contains("dark")

            ? "dark"

            : "light"

    );

}


/* =================================
   LOAD THEME
================================= */

(function(){

    if(

        localStorage.getItem(
            "MAPL_THEME"
        ) === "dark"

    ){

        document
        .documentElement
        .classList
        .add("dark");

    }

})();


/* =================================
   ENTER KEY
================================= */

document
.getElementById("password")
.addEventListener(
    "keypress",
    function(event){

        if(event.key === "Enter"){

            document
            .getElementById("loginForm")
            .requestSubmit();

        }

    }
);


</script>


</body>
</html>
